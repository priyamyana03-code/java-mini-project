# ===================================================================
# ARTIST HUB - Spring Boot Application Configuration
# ===================================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=artist-hub

# -------------------------------------------------------------------
# MySQL Database Configuration
# -------------------------------------------------------------------
# STEP 1: Open MySQL and create the database:
#         CREATE DATABASE artist_hub;
# STEP 2: Replace YOUR_PASSWORD below with your local MySQL password.
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/artist_hub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=YOUR_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Static resources mapping
spring.web.resources.static-locations=classpath:/static/
