# ===================================================================
# ARTIST HUB - Spring Boot Application Configuration
# ===================================================================

# Server Port (Binds to Railway dynamic $PORT in cloud, defaults to 8080 locally)
server.port=${PORT:8080}

# Application Name
spring.application.name=artist-hub

# -------------------------------------------------------------------
# MySQL Database Configuration
# Supports both Local Development and Railway Production Deployment
#
# Railway MySQL Environment Variables:
# - MYSQLHOST (e.g. mysql.railway.internal or host)
# - MYSQLPORT (e.g. 3306)
# - MYSQLDATABASE (e.g. railway or artist_hub)
# - MYSQLUSER (e.g. root)
# - MYSQLPASSWORD (secure password provided by Railway)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:artist_hub}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:YOUR_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration for MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Static resources mapping
spring.web.resources.static-locations=classpath:/static/
