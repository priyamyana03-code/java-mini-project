# ===================================================================
# ARTIST HUB - Spring Boot Application Configuration
# ===================================================================

# Server Port (Binds to Railway dynamic $PORT in cloud, defaults to 8080 locally)
server.port=${PORT:8080}

# Application Name
spring.application.name=artist-hub

# -------------------------------------------------------------------
# MySQL Database Configuration
# Supports both Local MySQL and Railway Cloud Deployment
#
# Environment variables automatically populated on Railway MySQL:
# - MYSQLHOST (e.g. mysql.railway.internal or custom host)
# - MYSQLPORT (defaults to 3306)
# - MYSQLDATABASE (defaults to artist_hub)
# - MYSQLUSER (defaults to root)
# - MYSQLPASSWORD (provided securely by Railway)
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:artist_hub}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:YOUR_PASSWORD}}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Static resources mapping
spring.web.resources.static-locations=classpath:/static/
