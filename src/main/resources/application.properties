# ===================================================================
# ARTIST HUB - Spring Boot Application Configuration
# ===================================================================

# Server Port (Binds to Railway dynamic $PORT in cloud, defaults to 8080 locally)
server.port=${PORT:8080}

# Application Name
spring.application.name=artist-hub

# -------------------------------------------------------------------
# MySQL Database Configuration
# Supports both Local Development and Railway Production Deployment
#
# Environment variables on Railway:
# - MYSQLHOST (Host of Railway MySQL service)
# - MYSQLPORT (Port of Railway MySQL service, e.g. 3306)
# - MYSQLDATABASE (Database name, e.g. railway or artist_hub)
# - MYSQLUSER (Database username, e.g. root)
# - MYSQLPASSWORD (Database password provided by Railway)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:artist_hub}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:YOUR_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Static resources mapping
spring.web.resources.static-locations=classpath:/static/
